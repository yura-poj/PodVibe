version: "3.9"

services:
  api:
    build: .
    environment:
      APP_PORT: "8080"
      DB_DSN: "postgres://postgres:postgres@postgres:5432/podvibe?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret"
      STORAGE_PATH: "/app/storage"
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: podvibe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
